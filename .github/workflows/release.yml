name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.mjs
      - run: npm pack
      - run: mv dsh-health-management-*.tgz dsh-health-management.tgz
      - run: gh release create "${GITHUB_REF_NAME}" dsh-health-management.tgz --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
